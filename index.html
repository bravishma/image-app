<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Image Blender</title>
<style>
  :root {
    --bg: #FAF7F2;
    --surface: #FFFFFF;
    --accent: #FF5B00;
    --accent-hover: #FF6600;
    --accent-soft: #FFF0E8;
    --ink: #1A1A1A;
    --muted: #8A8580;
    --line: #E8E2DA;
    --danger: #C4361B;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(26,26,26,.04), 0 8px 24px rgba(26,26,26,.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 880px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  /* ---------- header ---------- */
  header { text-align: center; margin-bottom: 32px; }
  h1 {
    margin: 0 0 8px;
    font-size: 30px;
    font-weight: 650;
    letter-spacing: -0.02em;
  }
  .subtitle { margin: 0; color: var(--muted); }

  /* ---------- central status badge ---------- */
  .badge-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 36px; }
  .badge {
    width: 96px; height: 96px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    position: relative;
    transition: background .25s ease, color .25s ease;
  }
  .badge svg { display: none; width: 36px; height: 36px; }
  [data-state="idle"]  .i-upload,
  [data-state="ready"] .i-upload,
  [data-state="loading"] .i-spin,
  [data-state="done"]  .i-check,
  [data-state="error"] .i-alert { display: block; }

  [data-state="error"] .badge { background: #FCEDEA; color: var(--danger); }
  [data-state="done"]  .badge { background: #EAF6EE; color: #1F7A46; }

  /* pulsing ring while the request is in flight */
  [data-state="loading"] .badge::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid var(--accent);
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0%   { transform: scale(1);    opacity: .55; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .i-spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { margin: 0; min-height: 22px; text-align: center; color: var(--muted); }
  [data-state="error"] .status { color: var(--danger); }
  .status-detail {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    max-width: 520px;
    word-break: break-word;
  }

  /* ---------- upload slots ---------- */
  .slots {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }
  @media (max-width: 640px) { .slots { grid-template-columns: 1fr; } }

  [data-state="loading"] .slots { opacity: .55; pointer-events: none; }

  .slot-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .drop {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    aspect-ratio: 4 / 3;
    padding: 16px;
    border: 1.5px dashed var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    cursor: pointer;
    text-align: center;
    transition: border-color .18s ease, background .18s ease;
  }
  .drop:hover,
  .drop.is-dragging { border-color: var(--accent); background: var(--accent-soft); }
  .drop svg { width: 26px; height: 26px; color: var(--muted); }
  .drop:hover svg, .drop.is-dragging svg { color: var(--accent); }
  .drop-title { font-weight: 550; }
  .drop-hint { font-size: 12.5px; color: var(--muted); }

  .slot.has-file .drop {
    border-style: solid;
    border-color: var(--line);
    padding: 0;
    overflow: hidden;
    cursor: default;
  }
  .slot.has-file .drop > .drop-inner { display: none; }

  .preview { display: none; width: 100%; height: 100%; object-fit: cover; }
  .slot.has-file .preview { display: block; }

  .remove {
    display: none;
    position: absolute; top: 8px; right: 8px;
    width: 28px; height: 28px;
    border: none; border-radius: 50%;
    background: rgba(26,26,26,.62);
    color: #fff;
    font-size: 16px; line-height: 1;
    cursor: pointer;
  }
  .remove:hover { background: rgba(26,26,26,.85); }
  .slot.has-file .remove { display: block; }

  .slot-error {
    margin: 8px 2px 0;
    font-size: 12.5px;
    color: var(--danger);
    min-height: 18px;
  }

  /* Visually hidden but still focusable — display:none would drop these
     out of the tab order and make the picker keyboard-unreachable. */
  input[type="file"] {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  .drop:focus-within {
    border-color: var(--accent);
    background: var(--accent-soft);
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- buttons ---------- */
  .actions { display: flex; justify-content: center; gap: 12px; }

  button {
    font: inherit;
    border-radius: 999px;
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, color .18s ease;
  }

  .btn-primary {
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    padding: 13px 30px;
    box-shadow: var(--shadow);
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:disabled {
    background: var(--line);
    color: var(--muted);
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-ghost {
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 12px 24px;
  }
  .btn-ghost:hover { border-color: var(--ink); }

  [data-state="loading"] #generate { display: none; }
  #cancel { display: none; }
  [data-state="loading"] #cancel { display: inline-block; }

  /* ---------- result ---------- */
  .result { display: none; margin-top: 36px; }
  [data-state="done"] .result { display: block; }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .result-frame {
    border-radius: 10px;
    overflow: hidden;
    /* checkerboard so transparent PNGs read correctly */
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #F0ECE6 25%, transparent 25%, transparent 75%, #F0ECE6 75%),
      linear-gradient(45deg, #F0ECE6 25%, transparent 25%, transparent 75%, #F0ECE6 75%);
    background-size: 18px 18px;
    background-position: 0 0, 9px 9px;
    display: grid; place-items: center;
  }
  #result-img { display: block; max-width: 100%; height: auto; }

  .result-actions { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
  .btn-primary.as-link {
    display: inline-block;
    text-decoration: none;
    text-align: center;
  }
</style>
</head>
<body>

<div id="app" data-state="idle">

  <header>
    <h1>AI Image Blender</h1>
    <p class="subtitle">Upload a subject and an accessory &mdash; get one composited image back.</p>
  </header>

  <div class="badge-wrap">
    <div class="badge" aria-hidden="true">
      <!-- idle / ready -->
      <svg class="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/>
      </svg>
      <!-- loading -->
      <svg class="i-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-6.22-8.56" opacity=".95"/>
      </svg>
      <!-- done -->
      <svg class="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"/>
      </svg>
      <!-- error -->
      <svg class="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5v.01"/>
      </svg>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">Add both images to get started.</p>
    <p class="status-detail" id="status-detail" aria-live="polite"></p>
  </div>

  <div class="slots" id="slots"></div>

  <div class="actions">
    <button class="btn-primary" id="generate" disabled>Generate Image</button>
    <button class="btn-ghost" id="cancel">Cancel / Stop</button>
  </div>

  <section class="result">
    <div class="result-card">
      <div class="result-frame"><img id="result-img" alt="Blended result"></div>
      <div class="result-actions">
        <a class="btn-primary as-link" id="download" download>Download Image</a>
        <button class="btn-ghost" id="reset">Start over</button>
      </div>
    </div>
  </section>

</div>

<template id="slot-tpl">
  <div class="slot">
    <span class="slot-label"></span>
    <label class="drop">
      <input type="file" accept="image/png,image/jpeg,image/webp">
      <div class="drop-inner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <span class="drop-title"></span>
        <span class="drop-hint">Click or drop &middot; PNG, JPG, WEBP &middot; max 10MB</span>
      </div>
      <img class="preview" alt="">
      <button class="remove" type="button" aria-label="Remove image">&times;</button>
    </label>
    <p class="slot-error"></p>
  </div>
</template>

<script>
(function () {
  'use strict';

  // Same-origin proxy. The real n8n URL lives in .env on the server and is
  // never sent to the browser.
  var BLEND_ENDPOINT = '/api/blend';
  var TIMEOUT_MS  = 60000;
  var MAX_BYTES   = 10 * 1024 * 1024;
  var ACCEPTED    = ['image/png', 'image/jpeg', 'image/webp'];

  var app       = document.getElementById('app');
  var statusEl  = document.getElementById('status');
  var detailEl  = document.getElementById('status-detail');
  var slotsEl   = document.getElementById('slots');
  var generate  = document.getElementById('generate');
  var cancelBtn = document.getElementById('cancel');
  var resetBtn  = document.getElementById('reset');
  var resultImg = document.getElementById('result-img');
  var download  = document.getElementById('download');

  var controller = null;   // shared by the 60s timer and the Cancel button
  var resultUrl  = null;   // object URL for the returned image, revoked on replace

  // ---------------------------------------------------------------- state
  function setState(next, message, detail) {
    app.dataset.state = next;
    statusEl.textContent = message || '';
    detailEl.textContent = detail || '';
    generate.disabled = next !== 'ready';
  }

  function bothReady() {
    return slots.every(function (s) { return s.file; });
  }

  function refreshIdle() {
    if (app.dataset.state === 'loading') return;
    if (bothReady()) setState('ready', 'Ready to blend.');
    else setState('idle', 'Add both images to get started.');
  }

  // ---------------------------------------------------------- upload slot
  function createUploadSlot(fieldName, label, hint) {
    var node    = document.getElementById('slot-tpl').content.cloneNode(true);
    var root    = node.querySelector('.slot');
    var input   = node.querySelector('input');
    var drop    = node.querySelector('.drop');
    var preview = node.querySelector('.preview');
    var remove  = node.querySelector('.remove');
    var errorEl = node.querySelector('.slot-error');

    node.querySelector('.slot-label').textContent = label;
    node.querySelector('.drop-title').textContent = hint;
    input.name = fieldName;

    var slot = { name: fieldName, file: null, url: null };

    function releaseUrl() {
      if (slot.url) { URL.revokeObjectURL(slot.url); slot.url = null; }
    }

    function clear() {
      releaseUrl();
      slot.file = null;
      input.value = '';
      preview.removeAttribute('src');
      root.classList.remove('has-file');
      errorEl.textContent = '';
      refreshIdle();
    }

    function accept(file) {
      if (!file) return;
      if (ACCEPTED.indexOf(file.type) === -1) {
        errorEl.textContent = 'Unsupported format. Use PNG, JPG, or WEBP.';
        return;
      }
      if (file.size > MAX_BYTES) {
        errorEl.textContent = 'File is larger than 10MB. Please choose a smaller image.';
        return;
      }
      releaseUrl();
      errorEl.textContent = '';
      slot.file = file;
      slot.url = URL.createObjectURL(file);
      preview.src = slot.url;
      root.classList.add('has-file');
      refreshIdle();
    }

    input.addEventListener('change', function () { accept(input.files[0]); });

    remove.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      clear();
    });

    ['dragenter', 'dragover'].forEach(function (evt) {
      drop.addEventListener(evt, function (e) {
        e.preventDefault();
        drop.classList.add('is-dragging');
      });
    });
    ['dragleave', 'dragend'].forEach(function (evt) {
      drop.addEventListener(evt, function () { drop.classList.remove('is-dragging'); });
    });
    drop.addEventListener('drop', function (e) {
      e.preventDefault();
      drop.classList.remove('is-dragging');
      if (root.classList.contains('has-file')) return;
      accept(e.dataTransfer.files[0]);
    });

    slot.clear = clear;
    slotsEl.appendChild(node);
    return slot;
  }

  var slots = [
    createUploadSlot('image1', 'Slot 1 — Subject', 'Person photo'),
    createUploadSlot('image2', 'Slot 2 — Accessory', 'Hat or accessory')
  ];

  // --------------------------------------------------- upload preparation
  // Vercel rejects request bodies over ~4.5MB, but the picker accepts 10MB
  // per file. Downscale before sending: Gemini downscales internally anyway,
  // so this costs no visible quality and makes requests much faster.
  var UPLOAD_TARGET_BYTES = 1.6 * 1024 * 1024;   // per image
  var MAX_EDGE = 1536;

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload  = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
      img.src = url;
    });
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise(function (resolve) { canvas.toBlob(resolve, type, quality); });
  }

  async function prepareForUpload(file) {
    if (file.size <= UPLOAD_TARGET_BYTES) return file;

    var img = await loadImage(file);
    // Keep PNG for PNGs: accessory cut-outs rely on the alpha channel, and
    // re-encoding those as JPEG would flatten transparency to black.
    var type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    var edge = MAX_EDGE, quality = 0.9, out = null;

    for (var attempt = 0; attempt < 5; attempt++) {
      var scale = Math.min(1, edge / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width  = Math.max(1, Math.round(img.width  * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

      out = await canvasToBlob(c, type, quality);
      if (out && out.size <= UPLOAD_TARGET_BYTES) break;
      edge = Math.round(edge * 0.75);
      if (type === 'image/jpeg') quality = Math.max(0.6, quality - 0.1);
    }

    if (!out) return file;                       // canvas failed: send the original
    var base = file.name.replace(/\.[^.]+$/, '');
    return new File([out], base + (type === 'image/png' ? '.png' : '.jpg'), { type: type });
  }

  // ------------------------------------------------------ response shapes
  // n8n may return raw binary or JSON (URL / data URI / bare base64), so try
  // each shape in turn rather than assuming one.
  function firstString(obj, keys) {
    for (var i = 0; i < keys.length; i++) {
      var v = obj[keys[i]];
      if (typeof v === 'string' && v.trim()) return v.trim();
    }
    return null;
  }

  function fromText(text) {
    var t = text.trim();
    if (/^data:image\//i.test(t)) return { src: t, mime: (t.split(';')[0] || '').slice(5) };
    if (/^https?:\/\/\S+$/i.test(t)) return { src: t, mime: '' };
    return null;
  }

  async function resolveImageSrc(res) {
    var type = (res.headers.get('content-type') || '').toLowerCase();

    // 200 with no payload: the Respond to Webhook node returned nothing.
    // Call this out by name rather than letting res.json() die on empty input.
    if (res.status === 204 || res.headers.get('content-length') === '0' || !type) {
      throw new Error('n8n returned an empty body (HTTP ' + res.status + ') \u2014 the workflow most likely failed before it could respond. Check the newest run in the n8n Executions tab.');
    }

    // 1. raw binary
    if (type.indexOf('image/') === 0) {
      var blob = await res.blob();
      return { src: URL.createObjectURL(blob), mime: blob.type, isObjectUrl: true };
    }

    // 2. JSON payload
    if (type.indexOf('application/json') !== -1) {
      var rawJson = await res.text();
      if (!rawJson.trim()) {
        throw new Error('n8n returned an empty body (HTTP ' + res.status + ') \u2014 the workflow most likely failed before it could respond. Check the newest run in the n8n Executions tab.');
      }
      var data;
      try { data = JSON.parse(rawJson); }
      catch (e) { throw new Error('Response was not valid JSON: ' + rawJson.slice(0, 120)); }

      // the proxy reports upstream trouble as {error: "..."}
      if (data && typeof data === 'object' && !Array.isArray(data) && typeof data.error === 'string') {
        throw new Error(data.error);
      }
      if (Array.isArray(data)) data = data[0];
      if (data && typeof data === 'object') {
        if (data.data && typeof data.data === 'object') data = data.data;

        var direct = firstString(data, ['url', 'image', 'imageUrl', 'imageURL', 'data', 'b64_json', 'result', 'link']);
        if (direct) {
          if (/^data:image\//i.test(direct)) return { src: direct, mime: (direct.split(';')[0] || '').slice(5) };
          if (/^https?:\/\//i.test(direct)) return { src: direct, mime: '' };
          // bare base64 with no data: prefix
          if (/^[A-Za-z0-9+/=\s]+$/.test(direct) && direct.length > 100) {
            return { src: 'data:image/png;base64,' + direct.replace(/\s/g, ''), mime: 'image/png' };
          }
        }
      }
      throw new Error('Unrecognised JSON response: ' + JSON.stringify(data).slice(0, 120));
    }

    // 3. plain text that is really a data URI or URL
    var text = await res.text();
    var parsed = fromText(text);
    if (parsed) return parsed;

    throw new Error('Unrecognised response body: ' + text.slice(0, 120));
  }

  function extFor(mime) {
    if (/jpe?g/i.test(mime)) return 'jpg';
    if (/webp/i.test(mime))  return 'webp';
    return 'png';
  }

  // ------------------------------------------------------------- submit
  async function submit() {
    if (!bothReady()) return;

    setState('loading', 'Preparing images...');

    var form = new FormData();
    try {
      var prepared = await Promise.all(slots.map(function (s) { return prepareForUpload(s.file); }));
      slots.forEach(function (s, i) { form.append(s.name, prepared[i], prepared[i].name); });
    } catch (err) {
      setState('error', 'Image processing failed. Please try again.', String((err && err.message) || err));
      return;
    }

    controller = new AbortController();
    var timer = setTimeout(function () { controller.abort('timeout'); }, TIMEOUT_MS);

    setState('loading', 'Processing image generation...');

    try {
      // No Content-Type header: the browser must set the multipart boundary.
      var res = await fetch(BLEND_ENDPOINT, {
        method: 'POST',
        body: form,
        signal: controller.signal
      });

      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);

      var out = await resolveImageSrc(res);

      // A cross-origin URL can't be saved via the download attribute, so pull it
      // into a blob when the host allows it; otherwise keep the direct link.
      if (!out.isObjectUrl && /^https?:/i.test(out.src)) {
        try {
          var remote = await fetch(out.src, { signal: controller.signal });
          if (remote.ok) {
            var rb = await remote.blob();
            out = { src: URL.createObjectURL(rb), mime: rb.type || out.mime, isObjectUrl: true };
          }
        } catch (e) { /* CORS or network: fall back to the direct URL */ }
      }

      if (resultUrl) URL.revokeObjectURL(resultUrl);
      resultUrl = out.isObjectUrl ? out.src : null;

      resultImg.src = out.src;
      download.href = out.src;
      download.setAttribute('download', 'blend-' + Date.now() + '.' + extFor(out.mime || out.src));

      setState('done', 'Done.');
    } catch (err) {
      if (err && err.name === 'AbortError') {
        if (controller.signal.reason === 'timeout') {
          setState('error', 'Image processing failed. Please try again.', 'Request timed out after 60 seconds.');
        } else {
          refreshIdle();                       // user cancelled: return quietly
          statusEl.textContent = 'Cancelled.';
        }
      } else {
        setState('error', 'Image processing failed. Please try again.', String(err && err.message || err));
      }
    } finally {
      clearTimeout(timer);
      controller = null;
    }
  }

  // -------------------------------------------------------------- wiring
  generate.addEventListener('click', submit);

  cancelBtn.addEventListener('click', function () {
    if (controller) controller.abort('user');
  });

  resetBtn.addEventListener('click', function () {
    if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = null; }
    resultImg.removeAttribute('src');
    download.removeAttribute('href');
    slots.forEach(function (s) { s.clear(); });
    refreshIdle();
  });

  window.addEventListener('beforeunload', function () {
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    slots.forEach(function (s) { if (s.url) URL.revokeObjectURL(s.url); });
  });
})();
</script>

</body>
</html>
